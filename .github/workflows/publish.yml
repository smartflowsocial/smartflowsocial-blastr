name: Publish

# Manual production deploy. Pushing main or master does not deploy.
# The previous workflow listened to master, which is not this repository's
# default branch, so a push to main never published the worker. Turning that
# trigger into a push to main would enable automatic production deployment.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-production to publish the production worker
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy-production'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cloudflare credential preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-deploy-preflight.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy
