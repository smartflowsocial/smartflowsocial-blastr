name: Publish Staging

# Manual staging deploy. It publishes --env staging, which uses
# blastr-publish-jobs-staging. Create that queue before the first deploy of
# this configuration. Do not point staging at blastr-publish-jobs.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-staging to publish the staging worker
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy-staging'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cloudflare credential preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-deploy-preflight.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --env staging
