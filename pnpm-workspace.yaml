# pnpm 12 waits a day before installing a newly published package. This project
# does not use that delay.
minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

overrides:
  minimatch: ">=10.2.3"
  esbuild: ">=0.25.0"
  brace-expansion: ">=5.0.11 <6"
  browserslist: ">=4.28.7 <5"
  flatted: ">=3.4.2 <4"
  js-yaml: ">=4.3.2 <5"
  nanoid: ">=3.3.18 <4"
  "picomatch@^2.3.1": 2.3.2
  "picomatch@>=4": 4.0.7
  postcss: ">=8.5.18 <9"
  sharp: ">=0.35.5 <0.36"
  source-map-js: ">=1.2.2 <2"
  undici: ">=7.30.1 <8"
  ws: ">=8.21.0 <9"
  "@typescript-eslint/typescript-estree>typescript": 6.0.2
  "@typescript-eslint/parser>typescript": 6.0.2
  "@typescript-eslint/eslint-plugin>typescript": 6.0.2
  "@typescript-eslint/utils>typescript": 6.0.2
  "@typescript-eslint/type-utils>typescript": 6.0.2
  "@typescript-eslint/project-service>typescript": 6.0.2
  "@typescript-eslint/scope-manager>typescript": 6.0.2
  "@typescript-eslint/tsconfig-utils>typescript": 6.0.2
  "typescript-eslint>typescript": 6.0.2
